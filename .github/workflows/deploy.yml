name: Deploy Kubernetes
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, staging, production]
        required: true
      commit:
        description: Full SHA of a successful main-branch Verify Little List run
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - name: Require a successful verified commit
        uses: actions/github-script@v7
        env:
          RELEASE_SHA: ${{ inputs.commit }}
        with:
          script: |
            const sha = process.env.RELEASE_SHA;
            if (!/^[a-f0-9]{40}$/.test(sha)) throw new Error('Full commit SHA required');
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'verify.yml', head_sha: sha, branch: 'main', event: 'push'
            });
            if (!data.workflow_runs.some(r => r.conclusion === 'success')) throw new Error('No successful main verification/image publication for this SHA');
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - name: Deploy tested images
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          RELEASE_SHA: ${{ inputs.commit }}
          DEPLOY_ENV: ${{ inputs.environment }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          set -eu
          test -n "$KUBE_CONFIG"
          test -n "$PUBLIC_HOST"
          case "$PUBLIC_HOST" in *example.invalid*|*/*|*:*|*' '*) echo 'Configure a DNS hostname in PUBLIC_HOST'; exit 1;; esac
          export KUBECONFIG="$RUNNER_TEMP/little-list-kubeconfig"
          trap 'rm -f "$KUBECONFIG"' EXIT
          umask 077
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG"
          helm upgrade --install little-list deploy/helm/little-list             --namespace "little-list-$DEPLOY_ENV"             -f "deploy/environments/$DEPLOY_ENV.yaml"             --set-string image.tag="$RELEASE_SHA"             --set-string ingress.host="$PUBLIC_HOST"             --set-string config.WEB_URL="https://$PUBLIC_HOST"             --atomic --wait --timeout 10m
