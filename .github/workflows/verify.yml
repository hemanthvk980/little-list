name: Verify Little List
on: [push, pull_request]
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: sh scripts/check-helm.sh
      - run: sh mvnw -B verify
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: node --test scripts/capture.test.mjs scripts/extension.test.mjs scripts/qr.test.mjs
      - run: docker compose up -d --wait
      - name: Start apps and verify the HTTP workflow
        run: |
          java -jar backend/target/little-list-0.1.0.jar --spring.profiles.active=local > /tmp/little-list-backend.log 2>&1 &
          (cd frontend && npm start > /tmp/little-list-frontend.log 2>&1) &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/v1/session > /dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Build container images
        run: docker compose -f compose.yaml -f compose.app.yaml build
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: docker compose down

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/hemanthvk980/little-list-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: BACKEND_URL=http://little-list-backend:8080
          tags: ghcr.io/hemanthvk980/little-list-frontend:${{ github.sha }}
