# Optional local container app. Run alongside compose.yaml.
services:
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://postgres:5432/littlelist
      MAIL_HOST: mailpit
      WEB_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
