services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: littlelist
      POSTGRES_USER: littlelist
      POSTGRES_PASSWORD: littlelist-local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - littlelist-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littlelist"]
      interval: 3s
      timeout: 2s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.28
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
volumes:
  littlelist-data:
